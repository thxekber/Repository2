<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #dfe9f3, #ffffff);
    }

    .calculator {
      width: 320px;
      background: #1f1f1f;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
    }

    #display {
      width: 100%;
      height: 70px;
      background: #2b2b2b;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 2rem;
      text-align: right;
      padding: 0 16px;
      margin-bottom: 18px;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      border: none;
      border-radius: 12px;
      height: 60px;
      font-size: 1.2rem;
      cursor: pointer;
      transition: transform 0.1s ease, opacity 0.2s ease;
    }

    button:hover {
      opacity: 0.95;
    }

    button:active {
      transform: scale(0.98);
    }

    .operator,
    .action {
      background: #ff9f0a;
      color: #fff;
    }

    .number {
      background: #e9e9e9;
      color: #111;
    }

    .clear {
      background: #d9534f;
      color: #fff;
      grid-column: span 2;
    }

    .zero {
      grid-column: span 2;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <input id="display" type="text" readonly value="0" />
    <div class="buttons">
      <button class="clear" type="button">C</button>
      <button class="action" type="button" data-action="delete">DEL</button>
      <button class="operator" type="button" data-operator="/">÷</button>

      <button class="number" type="button" data-value="7">7</button>
      <button class="number" type="button" data-value="8">8</button>
      <button class="number" type="button" data-value="9">9</button>
      <button class="operator" type="button" data-operator="*">×</button>

      <button class="number" type="button" data-value="4">4</button>
      <button class="number" type="button" data-value="5">5</button>
      <button class="number" type="button" data-value="6">6</button>
      <button class="operator" type="button" data-operator="-">−</button>

      <button class="number" type="button" data-value="1">1</button>
      <button class="number" type="button" data-value="2">2</button>
      <button class="number" type="button" data-value="3">3</button>
      <button class="operator" type="button" data-operator="+">+</button>

      <button class="number zero" type="button" data-value="0">0</button>
      <button class="number" type="button" data-value=".">.</button>
      <button class="action" type="button" data-action="calculate">=</button>
    </div>
  </div>

  <script>
    const display = document.getElementById('display');
    let currentValue = '0';
    let storedValue = null;
    let operator = null;

    function updateDisplay() {
      display.value = currentValue;
    }

    function appendNumber(value) {
      if (value === '.' && currentValue.includes('.')) return;

      if (currentValue === '0' && value !== '.') {
        currentValue = value;
      } else {
        currentValue += value;
      }

      updateDisplay();
    }

    function setOperator(nextOperator) {
      if (storedValue !== null && operator !== null && currentValue !== '') {
        calculate();
      }

      storedValue = Number(currentValue);
      operator = nextOperator;
      currentValue = '0';
    }

    function calculate() {
      if (storedValue === null || operator === null) return;

      const first = storedValue;
      const second = Number(currentValue);
      let result = 0;

      switch (operator) {
        case '+':
          result = first + second;
          break;
        case '-':
          result = first - second;
          break;
        case '*':
          result = first * second;
          break;
        case '/':
          result = second === 0 ? 'Error' : first / second;
          break;
      }

      currentValue = String(result);
      storedValue = null;
      operator = null;
      updateDisplay();
    }

    function clearDisplay() {
      currentValue = '0';
      storedValue = null;
      operator = null;
      updateDisplay();
    }

    function deleteLast() {
      if (currentValue.length <= 1) {
        currentValue = '0';
      } else {
        currentValue = currentValue.slice(0, -1);
      }
      updateDisplay();
    }

    document.querySelectorAll('.number').forEach((button) => {
      button.addEventListener('click', () => {
        appendNumber(button.dataset.value);
      });
    });

    document.querySelectorAll('.operator').forEach((button) => {
      button.addEventListener('click', () => {
        setOperator(button.dataset.operator);
      });
    });

    document.querySelector('[data-action="calculate"]').addEventListener('click', calculate);
    document.querySelector('.clear').addEventListener('click', clearDisplay);
    document.querySelector('[data-action="delete"]').addEventListener('click', deleteLast);

    updateDisplay();
  </script>
</body>
</html>
